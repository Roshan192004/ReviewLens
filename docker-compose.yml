services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PORT: "4000"
      CACHE_DB_PATH: /data/reviewlens.db
    expose:
      - "4000"
    volumes:
      - reviewlens-data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  reviewlens-data:
