version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PORT=4000
      - CACHE_DB_PATH=/data/cache.db
    volumes:
      - cache-data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  cache-data:

# Usage:
#   export GEMINI_API_KEY=your_key   (or GROQ_API_KEY)
#   docker compose up --build
#
# Dockerfiles are stubbed – completed in Phase 12.

